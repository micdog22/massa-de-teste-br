[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "massa-de-teste-br"
version = "1.0.0"
description = "Gere dados brasileiros fictícios (pessoas e empresas) para testes e desenvolvimento: CPF, CNPJ, CEP e telefones coerentes."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["brasil", "dados-de-teste", "cpf", "cnpj", "cep", "fixtures", "fake-data"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/micdog22/massa-de-teste-br"
Issues = "https://github.com/micdog22/massa-de-teste-br/issues"

[project.scripts]
massa-de-teste-br = "massa_de_teste_br.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
